name: Release

# Push a version tag (e.g. `npm version minor && git push --follow-tags`) to
# build the Windows installer and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --win --publish never
        env:
          # The installer isn't code-signed yet.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
